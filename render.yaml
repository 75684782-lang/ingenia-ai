services:
  - type: web
    name: ingenia-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements-prod.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /api/health
    disk:
      name: ingenia-ai-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: INGENIA_ALLOW_REMOTE
        value: "true"
      - key: INGENIA_COOKIE_SECURE
        value: "true"
      - key: INGENIA_AUTH_TOKEN
        generateValue: true
      - key: INGENIA_ACCOUNTS
        value: "true"
      - key: INGENIA_USE_AGENTS
        value: "true"
      - key: DATABASE_PATH
        value: /var/data/ingenia.db
      - key: CIVIL3D_FALLBACK_TO_MOCK
        value: "false"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
